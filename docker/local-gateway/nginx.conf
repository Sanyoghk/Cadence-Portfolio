# Local loopback ingress only. Upstreams are fixed; caller input cannot select a target.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 128;
    multi_accept off;
}

http {
    access_log off;
    server_tokens off;
    default_type application/octet-stream;
    client_max_body_size 11m;
    client_body_buffer_size 64k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    client_header_timeout 10s;
    client_body_timeout 20s;
    send_timeout 30s;
    keepalive_timeout 10s;
    keepalive_requests 100;
    reset_timedout_connection on;
    client_body_temp_path /tmp/client_body 1 2;
    proxy_temp_path /tmp/proxy 1 2;
    fastcgi_temp_path /tmp/fastcgi 1 2;
    uwsgi_temp_path /tmp/uwsgi 1 2;
    scgi_temp_path /tmp/scgi 1 2;
    proxy_max_temp_file_size 0;
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
    proxy_busy_buffers_size 16k;
    limit_conn_zone $binary_remote_addr zone=local_http:1m;

    server {
        listen 8080;
        limit_conn local_http 16;
        limit_conn_status 429;

        location / {
            proxy_pass http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
            proxy_next_upstream off;
            proxy_request_buffering on;
        }
    }
}

stream {
    access_log off;
    limit_conn_zone $binary_remote_addr zone=local_stream:1m;

    server {
        listen 5432;
        limit_conn local_stream 16;
        proxy_connect_timeout 3s;
        proxy_timeout 60s;
        proxy_buffer_size 16k;
        proxy_pass postgres:5432;
    }

    server {
        listen 9000;
        limit_conn local_stream 16;
        proxy_connect_timeout 3s;
        proxy_timeout 60s;
        proxy_buffer_size 16k;
        proxy_pass minio:9000;
    }
}
