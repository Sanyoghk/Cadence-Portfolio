Foreground yes
LogTime yes
LogFile /tmp/clamd.log
LogFileMaxSize 1M
LogRotate yes
PidFile /tmp/clamd.pid
TemporaryDirectory /tmp
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
MaxThreads 2
MaxQueue 4
ReadTimeout 10
CommandReadTimeout 5
SendBufTimeout 5
StreamMaxLength 10M
MaxScanTime 10000
MaxScanSize 20M
MaxFileSize 10M
MaxRecursion 5
MaxFiles 100
AlertExceedsMax yes
AlertEncrypted yes
SelfCheck 60
ExitOnOOM yes
