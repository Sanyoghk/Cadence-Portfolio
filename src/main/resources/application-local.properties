spring.datasource.url=jdbc:h2:mem:cadence-local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
cadence.brand-analysis.adapter=${CADENCE_BRAND_ANALYSIS_ADAPTER:fake}
cadence.evidence.storage-root=${CADENCE_EVIDENCE_STORAGE_ROOT:var/evidence}

cadence.strategy-generation.adapter=${CADENCE_STRATEGY_GENERATION_ADAPTER:fake}

# Synthetic accounting fixture, not a product tariff or measured provider usage.
cadence.ai-budget.mode=synthetic
cadence.ai-budget.policy-version=synthetic-fixture-v1
cadence.ai-budget.upper=1
cadence.ai-budget.global-spend=1000000
cadence.ai-budget.account-spend=100000
cadence.ai-budget.workspace-spend=10000
cadence.ai-budget.global-queued=1000
cadence.ai-budget.account-queued=100
cadence.ai-budget.workspace-queued=100
cadence.ai-budget.global-running=100
cadence.ai-budget.account-running=20
cadence.ai-budget.workspace-running=10
cadence.ai-budget.global-retained=1000000
cadence.ai-budget.account-retained=10000
cadence.ai-budget.workspace-retained=1000

cadence.content-generation.adapter=fake
