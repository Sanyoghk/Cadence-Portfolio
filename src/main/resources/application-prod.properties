spring.datasource.url=${CADENCE_DB_URL}
spring.datasource.username=${CADENCE_DB_USERNAME}
spring.datasource.password=${CADENCE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${CADENCE_DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${CADENCE_DB_MIN_IDLE:2}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

# PostgreSQL constraint diagnostics may contain user row values; HTTP advice logs safe codes only.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.SQL=OFF
