spring.application.name=cadence
cadence.workspaces.max-per-account=${CADENCE_MAX_WORKSPACES_PER_ACCOUNT:3}
cadence.evidence.url-worker-enabled=${CADENCE_URL_FETCH_WORKER_ENABLED:false}
cadence.ai-jobs.worker-enabled=${CADENCE_AI_JOBS_WORKER_ENABLED:false}
cadence.ai-jobs.max-retained-per-workspace=${CADENCE_AI_JOBS_MAX_RETAINED_PER_WORKSPACE:1000}
cadence.evidence.file-scan-worker-enabled=${CADENCE_FILE_SCAN_WORKER_ENABLED:false}
cadence.evidence.artifacts-enabled=${CADENCE_EVIDENCE_ARTIFACTS_ENABLED:false}
cadence.evidence.cleanup-enabled=${CADENCE_EVIDENCE_CLEANUP_ENABLED:false}
cadence.evidence.production-approved=${CADENCE_EVIDENCE_PRODUCTION_APPROVED:false}
cadence.evidence.egress-policy-acknowledged=${CADENCE_EVIDENCE_EGRESS_POLICY_ACKNOWLEDGED:false}
cadence.evidence.retention-policy-acknowledged=${CADENCE_EVIDENCE_RETENTION_POLICY_ACKNOWLEDGED:false}
spring.profiles.default=local
spring.jpa.open-in-view=false
spring.transaction.default-timeout=10s
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson2.time-zone=UTC
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.tomcat.threads.max=32
server.tomcat.max-connections=128
server.tomcat.accept-count=32
server.tomcat.max-http-form-post-size=${CADENCE_EVIDENCE_MAX_NON_MULTIPART_BYTES:131072}
cadence.evidence.max-non-multipart-bytes=${CADENCE_EVIDENCE_MAX_NON_MULTIPART_BYTES:131072}
cadence.evidence.max-concurrent-uploads=${CADENCE_EVIDENCE_MAX_CONCURRENT_UPLOADS:2}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
cadence.security.clerk.issuer=${CLERK_ISSUER_URI:https://placeholder.clerk.accounts.dev}
cadence.security.clerk.jwks-uri=${CLERK_JWKS_URI:${cadence.security.clerk.issuer}/.well-known/jwks.json}
cadence.security.clerk.audience=${CLERK_AUDIENCE:cadence-api}
cadence.security.clerk.authorized-parties=${CLERK_AUTHORIZED_PARTIES:http://localhost:3000}
cadence.security.cors.allowed-origins=${CADENCE_CORS_ALLOWED_ORIGINS:}

# Technical process admission bounds; durable cost/queue budgets are independently enforced.
cadence.http.max-concurrent=${CADENCE_HTTP_MAX_CONCURRENT:16}
cadence.http.reads-per-minute=${CADENCE_HTTP_READS_PER_MINUTE:1200}
cadence.http.writes-per-minute=${CADENCE_HTTP_WRITES_PER_MINUTE:120}
cadence.http.max-rate-accounts=${CADENCE_HTTP_MAX_RATE_ACCOUNTS:2048}
# Only a server-generated UUID enters MDC; no token/subject/URL/prompt log context.
logging.pattern.level=%5p [request:%X{requestId:-none}]

# Preserve the reviewed JSON 2 wire/snapshot contract during the Boot 4 migration.
spring.http.converters.preferred-json-mapper=jackson2

# Live Content provider remains disabled until separate adapter qualification.
cadence.content-generation.adapter=${CADENCE_CONTENT_GENERATION_ADAPTER:disabled}

# Pure private CSV worker; explicit activation, no model/provider call.
cadence.csv-export.worker-enabled=${CADENCE_CSV_EXPORT_WORKER_ENABLED:false}
cadence.metrics-import.worker-enabled=${CADENCE_METRICS_IMPORT_WORKER_ENABLED:false}
cadence.reports.worker-enabled=${CADENCE_REPORTS_WORKER_ENABLED:false}
