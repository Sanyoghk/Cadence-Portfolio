name: Repository exposure checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exposure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test privacy detector and check tracked snapshot
        run: |
          python3 -m unittest discover -s scripts -p 'test_audit_publication.py'
          python3 scripts/audit_publication.py
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publication-tools"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/publication-gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/publication-gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/publication-gitleaks.tar.gz" -C "$RUNNER_TEMP/publication-tools" gitleaks
      - name: Scan reachable history for secrets without exposing values
        run: >-
          "$RUNNER_TEMP/publication-tools/gitleaks" git --redact --no-banner
          --log-opts="--all" --max-decode-depth=3 --max-archive-depth=3 .
      - name: Require complete fetched-history privacy gate
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r ref; do args+=(--ref "$ref"); done < <(git for-each-ref --format='%(refname)' refs/remotes refs/tags)
          python3 scripts/audit_publication.py --history "${args[@]}"
      # This is prevention, not approval to change visibility. PR refs, GitHub comments,
      # Actions history/artifacts, media and historical author data need a separate audit.
